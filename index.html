<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="訓練記錄">
<meta name="theme-color" content="#111214">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>訓練記錄</title>
<style>
:root{
  --bg:#111214; --panel:#1b1d21; --panel2:#24272c; --panel3:#2c3036; --line:#2a2e34;
  --text:#f2f3f5; --dim:#9aa1ab; --faint:#6b717b;
  --accent:#c6f432; --accent-ink:#151a05; --warn:#ffb547; --bad:#ff6b6b; --good:#5ee0a0;
  --r:16px; --ease:cubic-bezier(.2,.8,.2,1);
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC",sans-serif;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
svg{display:block}
.hidden{display:none!important}
.muted{color:var(--dim)} .faint{color:var(--faint)} .small{font-size:13px} .flex1{flex:1}
.num{font-variant-numeric:tabular-nums}

.app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;padding:0 16px calc(var(--safe-b) + 28px)}
body.resting .app{padding-bottom:calc(var(--safe-b) + 104px)}
.pg-fwd{animation:inR .28s var(--ease)} .pg-back{animation:inL .28s var(--ease)}
@keyframes inR{from{opacity:0;transform:translateX(18px)}} @keyframes inL{from{opacity:0;transform:translateX(-18px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* 頂列：貼頂、毛玻璃，避開 Dynamic Island */
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;min-height:44px;
  margin:0 -16px 6px;padding:calc(var(--safe-t) + 6px) 16px 8px;
  background:rgba(17,18,20,.78);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px)}
.top h1{font-size:19px;font-weight:700;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.large{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 14px}
.iconbtn{min-width:44px;height:44px;border-radius:22px;background:var(--panel);display:grid;place-items:center;color:var(--text)}
.iconbtn:active{background:var(--panel2)}
.sync{font-size:13px;padding:6px 10px;border-radius:999px;background:var(--panel);color:var(--warn);white-space:nowrap}
.sync.err{color:var(--bad)}
.endbtn{height:36px;padding:0 14px;border-radius:18px;background:var(--panel);color:var(--good);font-weight:700;font-size:15px;white-space:nowrap}
.endbtn:active{background:var(--panel2)}

.card{background:var(--panel);border-radius:var(--r);padding:14px 16px;margin-bottom:10px}
.label{font-size:13px;color:var(--dim);margin:14px 0 6px}

/* 首頁 */
.resume{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--accent);color:var(--accent-ink);
  border-radius:var(--r);padding:16px;margin-bottom:12px}
.resume b{display:block;font-size:22px;margin:1px 0}
.resume .small{opacity:.75;font-weight:600}
.resume:active{transform:scale(.985)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.daybtn{position:relative;background:var(--panel);border-radius:var(--r);padding:16px 14px;text-align:left;min-height:92px;
  display:flex;flex-direction:column;justify-content:flex-end;transition:transform .12s}
.daybtn:active{transform:scale(.97);background:var(--panel2)}
.daybtn b{display:block;font-size:20px;font-weight:700}
.daybtn .small{margin-top:3px}
.daybtn.next{box-shadow:inset 0 0 0 2px var(--accent)}
.daybtn .tag{position:absolute;top:12px;right:12px;font-size:12px;font-weight:700;color:var(--accent)}
.bw{margin-top:14px}
.bwhead{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.field{display:flex;gap:8px}
.textin,.field input{flex:1;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 12px;font-size:17px}
.pill-btn{height:48px;padding:0 18px;border-radius:12px;background:var(--panel2);font-weight:700}
.pill-btn.primary{background:var(--accent);color:var(--accent-ink)}
.foot{margin-top:18px;line-height:1.5}

/* 訓練頁：動作區塊 */
.exb{background:var(--panel);border-radius:var(--r);margin-bottom:10px;overflow:hidden;scroll-margin-top:calc(var(--safe-t) + 64px)}
.exb.active{box-shadow:inset 0 0 0 1px #3a3f47}
.exh{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px 16px}
.exh .body{flex:1;min-width:0}
.exh .name{font-weight:650;font-size:17px;line-height:1.25}
.exh .line{font-size:14px;color:var(--dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exh .chev{color:var(--faint)}
button.exh:active{background:var(--panel2)}
.exb.isdone:not(.active) .name{color:var(--dim)}
.badge{flex:none;width:40px;height:40px;border-radius:20px;background:var(--panel2);display:grid;place-items:center;font-weight:700;font-size:13px}
.badge.done{background:var(--good);color:#06281a}
.meta{padding:0 16px 10px;font-size:13px;color:var(--dim);line-height:1.5}
.meta .sug{color:var(--accent);font-weight:600}

/* 組列表 */
.srow{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1.15fr) 24px;align-items:center;gap:8px;
  min-height:44px;padding:0 16px;border-top:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.srow>span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .no{color:var(--faint);font-size:13px;font-weight:600}
.srow .prev{color:var(--faint)}
.srow .now{font-weight:650}
.srow .st{color:var(--good);display:grid;place-items:center}
.srow.shead{min-height:30px;font-size:12px;color:var(--faint);border-top:0}
.srow.done{cursor:pointer} .srow.done:active{background:var(--panel2)}
.srow.pend .st{color:var(--warn)}
.srow.plan .now{color:var(--faint);font-weight:400}
.srow.cur{background:rgba(198,244,50,.06)}
.srow.cur .no{color:var(--accent)}
.srow.cur .now{color:var(--text);font-weight:650}
.srow.editing{background:#3a2f12}
.srow.drop .no{color:#c9a8ff}
.dot{width:8px;height:8px;border-radius:4px;background:var(--warn);display:block}
.pop{animation:pop .35s var(--ease)}
@keyframes pop{0%{background:rgba(94,224,160,.25)}100%{background:transparent}}

/* 輸入區 */
.ed{padding:12px 16px 16px;border-top:1px solid var(--line)}
.edhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.editbar{display:flex;justify-content:space-between;align-items:center;background:#3a2f12;color:var(--warn);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.editbar button{color:var(--warn);font-weight:700;padding:4px 2px}
.mseg{display:flex;background:var(--bg);border-radius:10px;padding:3px;gap:2px}
.mseg button{height:32px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:600;color:var(--dim)}
.mseg button.on{background:var(--panel3);color:var(--text)}
.steppers{display:grid;grid-template-columns:1fr;gap:12px}
.stp .lab,.lab{font-size:13px;color:var(--dim);margin-bottom:6px}
.ctl{display:grid;grid-template-columns:72px minmax(0,1fr) 72px;height:60px;background:var(--bg);border-radius:14px;overflow:hidden}
.ctl button{font-size:28px;font-weight:500;color:var(--text);transition:background .1s}
.ctl button:active{background:var(--panel3)}
.ctl input{min-width:0;width:100%;border:0;background:transparent;color:var(--text);text-align:center;font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;padding:0}
.ctl input:focus{outline:none;background:#0a0b0c}
.rirlab{margin-top:14px}
.seg{display:flex;gap:6px}
.seg button{flex:1;height:44px;border-radius:12px;background:var(--panel2);font-weight:650;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--text);color:var(--bg)}
.notebtn{margin-top:12px;font-size:14px;color:var(--dim);padding:6px 0;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left}
#note{margin-top:8px;width:100%}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cgrid .lab{margin-top:4px}
.cgrid input{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 12px;font-size:18px;font-variant-numeric:tabular-nums}
.big{display:block;width:100%;height:58px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:18px;font-weight:800;margin-top:14px;transition:transform .1s}
.big:active{transform:scale(.98)}
.ghost{display:block;width:100%;height:48px;border-radius:12px;background:var(--panel2);margin-top:8px;font-weight:650}
.ghost:active{background:var(--panel3)}
.danger{color:var(--bad)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .ghost{margin-top:0}
.after{padding:12px 16px 16px;border-top:1px solid var(--line)}
.finish{display:block;width:100%;height:52px;border-radius:14px;margin-top:18px;background:transparent;border:1.5px solid var(--good);color:var(--good);font-weight:700;font-size:17px}
.finish:active{background:rgba(94,224,160,.1)}
.skel{height:76px;background:linear-gradient(90deg,var(--panel) 0%,var(--panel2) 50%,var(--panel) 100%);background-size:200% 100%;animation:sh 1.2s infinite}
@keyframes sh{to{background-position:-200% 0}}
.empty{padding:24px 4px;text-align:center}

/* 休息列：固定在底部，畫面已預留空間，不會擋到按鈕 */
.restbar{position:fixed;left:12px;right:12px;bottom:calc(var(--safe-b) + 10px);z-index:6;max-width:536px;margin:0 auto;
  display:flex;align-items:center;gap:8px;padding:10px 10px 10px 16px;border-radius:20px;overflow:hidden;
  background:rgba(36,39,44,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 10px 30px #000a;
  transition:background .25s,color .25s}
.restbar .prog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.06)}
.restbar .prog i{display:block;height:100%;background:var(--accent);transform-origin:left;transition:transform .5s linear}
.restbar .rinfo{flex:1;display:flex;align-items:baseline;gap:10px}
.restbar .rl{font-size:13px;color:var(--dim);font-weight:600}
.restbar .time{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.restbar button{height:44px;padding:0 14px;border-radius:12px;background:rgba(255,255,255,.08);font-weight:650}
.restbar.over{background:var(--accent);color:var(--accent-ink);animation:flash .6s 2}
.restbar.over .rl{color:var(--accent-ink)}
.restbar.over button{background:rgba(0,0,0,.12)}
.restbar.over .prog{display:none}
@keyframes flash{50%{transform:scale(1.03)}}

/* Toast：放在頂部，不擋底部操作 */
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 62px);transform:translateX(-50%);z-index:20;max-width:92vw;
  background:rgba(40,43,48,.96);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;
  padding:11px 16px;border-radius:14px;font-size:15px;font-weight:600;white-space:nowrap;box-shadow:0 8px 24px #0009;animation:tin .25s var(--ease)}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}

/* 底部表單 */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet .inner{background:var(--panel);width:100%;max-width:560px;max-height:86vh;overflow:auto;border-radius:22px 22px 0 0;
  padding:8px 16px calc(var(--safe-b) + 18px);animation:up .3s var(--ease)}
.sheet.out{opacity:0;transition:opacity .18s}
@keyframes fade{from{opacity:0}} @keyframes up{from{transform:translateY(40px);opacity:.6}}
.grab{width:36px;height:5px;border-radius:3px;background:var(--panel3);margin:0 auto 10px}
.sheethead{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sheethead b{flex:1;font-size:19px}
.list button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:14px 4px;border-bottom:1px solid var(--line);font-size:17px}
.list button.in{color:var(--faint)}
.toggle-row{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:12px;padding:12px 14px}
.toggle-row span{flex:1}
.toggle-row input{width:22px;height:22px;accent-color:var(--good)}
.howto{font-size:13px;color:var(--dim);line-height:1.6;margin:8px 2px 0;padding-left:18px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--bg);border-radius:14px;padding:12px}
.stat b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.stat .small{color:var(--dim)}
.up{color:var(--good)} .down{color:var(--warn)}
.sumlist div{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.sumlist span:last-child{color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.pr{background:rgba(198,244,50,.1);color:var(--accent);border-radius:12px;padding:10px 12px;font-weight:650;margin-bottom:6px}
.skipped{background:var(--bg);border-radius:12px;padding:10px 12px;margin-bottom:6px;font-size:14px;color:var(--dim);line-height:1.5}
.skipped b{color:var(--warn);display:block;font-size:15px}
.seg.wrap{flex-wrap:wrap} .seg.wrap button{flex:1 0 30%}
.sel{width:100%;height:48px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--text);padding:0 12px;font-size:17px;-webkit-appearance:none;appearance:none}
.syn{display:grid;grid-template-columns:1fr;gap:8px}
.haptic{position:fixed;left:-9999px;top:0;opacity:0;pointer-events:none}
</style>
</head>
<body>
<div class="app" id="app"></div>
<label class="haptic" id="hapticLbl"><input type="checkbox" switch></label>

<script>
'use strict';
/* ─────────── 儲存 ─────────── */
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
const cfg = LS.get('cfg', {url:'', token:''});
const prefs = Object.assign({shortcut:false, scName:'休息計時'}, LS.get('prefs', {}));
let queue = LS.get('queue', []);           // 待送的操作
let cache = LS.get('cache', {});           // 每個訓練日的 bootstrap 結果
let meta = LS.get('meta', null);           // 動作清單、訓練日等
let restSec = LS.get('restSec', 120);
let sessions = LS.get('sessions', {});     // {'日期|訓練日': {start, last}} 由第一組／最後一組時間推算
let finished = LS.get('finished', {});     // {'日期|訓練日': true}
let dayCount = LS.get('dayCount', {});     // 每個訓練日的動作數（首頁顯示用）
let skips = LS.get('skipDrops', {});       // {'日期|訓練日|動作': true} 今天略過菜單下降組的動作
const MUSCLES = ['胸','三角肌前束','三角肌中束','三角肌後束','背闊肌','上背（斜方／菱形）','二頭肌','三頭肌','前臂','股四頭肌','腿後肌','臀肌','小腿','腹肌','下背'];
const EX_TYPES = ['重量型','自重型','計時型','有氧-Zone2','有氧-HIIT','有氧-耐力'];

/* ─────────── 工具 ─────────── */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = n => (n===undefined||n===null||n==='') ? '' : String(Math.round(Number(n)*100)/100);
const todayStr = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now()+'-'+Math.random().toString(16).slice(2));
const isCardio = t => String(t||'').startsWith('有氧');
const isWeighty = t => t==='重量型' || t==='自重型';
const shortDate = d => d ? d.slice(5).replace('-','/') : '';
const isDB = name => /dumbbell|啞鈴|\bDB\b/i.test(String(name||''));
const e1rmOf = (kg, reps, rir) => Math.round(Number(kg)*(1+(Number(reps)+(Number(rir)||0))/30)*10)/10;
const sessKey = day => todayStr()+'|'+day;

const ICON = {
  back:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  chev:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  check:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  gear:'<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h9M18 7h2M4 17h3M12 17h8"/><circle cx="15.5" cy="7" r="2.3"/><circle cx="9.5" cy="17" r="2.3"/></svg>',
  x:'<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
};

/** ＋／− 按鈕的重量步進：一律 1 kg */
function kgStep(){ return 1; }
/** 下降組預填重量的取整單位：啞鈴 2 kg、其他 1 kg */
function plateStep(it){ return (it.type==='重量型' && isDB(it.ex)) ? 2 : 1; }
/** 啞鈴的建議重量對齊 2 kg（後端規則是 +2.5） */
function sugOf(it){
  const s = it.suggestion;
  // 只改「加重」建議；維持重量的建議照上次重量，不動
  if (!s || s.kind!=='add_weight' || !isDB(it.ex)) return s;
  const kg = Number(s.kg);
  const lastKg = Number((it.last.find(x=>x.setType==='正式')||{}).kg) || 0;
  if (!lastKg || kg - lastKg === 2) return s;
  const nk = lastKg + 2;
  return {...s, kg:nk, text:String(s.text||'').replace('到 '+fmt(kg)+' kg', '到 '+fmt(nk)+' kg')};
}

function setText(s){
  if (isCardio(s._type)) return cardioText(s);
  if (s._type==='計時型') return fmt(s.timedSec)+' 秒';
  const kg = (s._type==='自重型') ? (Number(s.kg) ? '+'+fmt(s.kg) : '自重') : fmt(s.kg);
  return kg + '×' + fmt(s.reps) + (s.rir!==undefined && s.rir!=='' && s.rir!==null ? ' @'+fmt(s.rir) : '');
}
function cardioText(s){
  if (s.z2min!==undefined && s.z2min!=='') return [fmt(s.z2min)+' 分', s.z2km!==undefined&&s.z2km!==''?fmt(s.z2km)+' km':'', s.z2inc!==undefined&&s.z2inc!==''?fmt(s.z2inc)+'%':''].filter(Boolean).join(' · ');
  if (s.sprSec!==undefined||s.jogSec!==undefined) return (s.rounds||1)+' 回 · 衝 '+fmt(s.sprSec)+'s/'+fmt(s.sprM)+'m · 慢 '+fmt(s.jogSec)+'s/'+fmt(s.jogM)+'m';
  return '—';
}
/** 菜單處方文字：「第1組 5-9｜第2組 10-15」或「3 組 × 10-15 下」「3 組 力竭」 */
function planText(p){
  if (!p) return '';
  const r = p.reps || [];
  const unit = x => /^\d/.test(x) ? x+' 下' : x;
  let t = r.length > 1 ? r.map((x,i)=>`第${i+1}組 ${unit(x)}`).join('｜')
        : (p.sets ? p.sets+' 組' : '') + (r.length ? (p.sets ? (/^\d/.test(r[0]) ? ' × ' : ' ') : '') + unit(r[0]) : '');
  if (p.note) t += (t ? '・' : '') + p.note;
  return t;
}
function summary(sets, type){
  if (!sets || !sets.length) return '';
  const w = sets.filter(s => s.setType !== '熱身');
  return (w.length ? w : sets).map(s => setText({...s, _type:type})).join('、');
}

/* ─────────── 網路 ─────────── */
async function apiGet(params){
  const u = new URL(cfg.url);
  Object.entries({...params, token: cfg.token}).forEach(([k,v]) => v!==undefined && u.searchParams.set(k, v));
  const res = await fetch(u.toString(), {method:'GET', redirect:'follow', cache:'no-store'});
  const j = await res.json();
  if (!j.ok) throw Object.assign(new Error(j.message || j.error), {code:j.error});
  return j;
}
async function apiPost(body){
  const res = await fetch(cfg.url, {method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({...body, token: cfg.token})});
  const j = await res.json();
  if (!j.ok) throw Object.assign(new Error(j.message || j.error), {code:j.error});
  return j;
}

/* ─────────── 待送佇列：先存手機、成功才移除；set_id 讓重送不會重複寫入 ─────────── */
let flushing = false, syncErr = '', retryTimer = null;
function enqueue(op){ queue.push(op); LS.set('queue', queue); renderSync(); flush(); }
async function flush(){
  if (flushing || !queue.length || !cfg.url) return;
  flushing = true; clearTimeout(retryTimer);
  try{
    while (queue.length){
      const op = queue[0];
      try{
        await apiPost(op);
        queue.shift(); LS.set('queue', queue); syncErr='';
        markSynced(op);
      }catch(e){
        if (['unauthorized','bad_json','bad_rir','bad_date','missing_ex','missing_set_id','bad_kg','bad_name','bad_type','bad_muscle','list_full','unknown_action'].includes(e.code)){
          queue.shift(); LS.set('queue', queue); syncErr = '有一筆被拒絕：'+e.message; toast(syncErr);
        } else if (e.code==='not_found' && op.action==='update'){
          queue.shift(); LS.set('queue', queue);
        } else { syncErr = '同步失敗，稍後自動重試'; retryTimer = setTimeout(flush, 8000); break; }
      }
      renderSync();
    }
  } finally { flushing = false; renderSync(); }
}
function markSynced(op){
  if (op.action!=='set') return;
  let hit = false;
  for (const d of Object.values(cache)) for (const it of (d.items||[])) for (const s of it.todaySets) if (s.setId===op.set_id){ s.pending=false; hit = true; }
  LS.set('cache', cache);
  if (!hit || view.name!=='day') return;
  // 只換掉那一列的狀態，不重繪整頁（避免打斷正在輸入的數字）
  const row = app.querySelector(`[data-edit="${CSS.escape(op.set_id)}"]`);
  if (row){ row.classList.remove('pend'); $('.st', row).innerHTML = ICON.check; }
}
window.addEventListener('online', ()=>{ flush(); renderSync(); });
window.addEventListener('offline', renderSync);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ flush(); keepAwake(); tickRest(); } });

function unlockAudio(){ try{ if(!audio){ audio = new (window.AudioContext||window.webkitAudioContext)(); } if (audio.state==='suspended') audio.resume(); }catch(e){} }
function beep(){
  if (!audio) return;
  [0, .25, .5].forEach(t => { const o=audio.createOscillator(), g=audio.createGain(); o.frequency.value=880; o.connect(g); g.connect(audio.destination);
    g.gain.setValueAtTime(.0001, audio.currentTime+t); g.gain.exponentialRampToValueAtTime(.4, audio.currentTime+t+.02);
    g.gain.exponentialRampToValueAtTime(.0001, audio.currentTime+t+.18); o.start(audio.currentTime+t); o.stop(audio.currentTime+t+.2); });
}

function startRest(){
  restTotal = restSec; restEnd = Date.now() + restSec*1000; beeped = false;
  LS.set('restEnd', restEnd); LS.set('restTotal', restTotal); tickRest();
  if (prefs.shortcut) runShortcut(restSec);

function tickRest(){
  clearInterval(restTick);
  const el = $('#rest');
  if (!el){ document.body.classList.remove('resting'); return; }
  const upd = () => {
    const leftMs = restEnd - Date.now(), left = Math.ceil(leftMs/1000);
    if (restEnd===0 || left < -600){ el.classList.add('hidden'); document.body.classList.remove('resting'); clearInterval(restTick); return; }
    el.classList.remove('hidden'); document.body.classList.add('resting');
    const a = Math.abs(left);
    $('.time', el).textContent = (left<0?'+':'') + Math.floor(a/60) + ':' + String(a%60).padStart(2,'0');
    $('.rl', el).textContent = left<=0 ? '時間到' : '休息';
    $('.prog i', el).style.transform = 'scaleX(' + Math.max(0, Math.min(1, leftMs/(restTotal*1000))) + ')';
    el.classList.toggle('over', left<=0);
    if (left<=0 && !beeped){ beeped=true; beep(); }
  };
  upd(); restTick = setInterval(upd, 500);
}

const loading = {};
async function loadDay(day){
  if (loading[day]) return; loading[day] = true;
  try{
    const r = await apiGet({action:'bootstrap', day, date: todayStr()});
    mergeDay(day, r);
    setMeta(r);

  }catch(e){
    if (!cache[day]) toast('讀取失敗：'+e.message); else toast('離線中，顯示上次載入的資料');
  }
  loading[day] = false;
  if (view.name==='day' && view.day===day){ view.loaded = true; readInputs(); renderDay(); }
}
/** 合併伺服器資料，保留還沒同步的本機組 */
function mergeDay(day, r){
  const old = cache[day];
  const pendingIds = new Set(queue.filter(q=>q.action==='set').map(q=>q.set_id));
  const undone = new Set(queue.filter(q=>q.action==='undo').map(q=>q.set_id));
  if (old && old.today===r.today){
    for (const oit of old.items){
      const local = oit.todaySets.filter(s => pendingIds.has(s.setId));
      if (!local.length) continue;
      let it = r.items.find(i=>i.ex===oit.ex);
      if (!it){ it = {...oit, todaySets:[]}; r.items.push(it); }
      for (const s of local) if (!it.todaySets.some(x=>x.setId===s.setId)) it.todaySets.push(s);
    }
  }
  for (const it of r.items) it.todaySets = it.todaySets.filter(s => !undone.has(s.setId));
  cache[day] = {today:r.today, items:r.items, at:Date.now()};
  for (const k of Object.keys(cache)) if (cache[k].today !== todayStr()) delete cache[k];
  LS.set('cache', cache);
}
function dayData(){ return cache[view.day]; }
function dayItems(){ return dayData()?.items || []; }
const workCount = it => it.todaySets.filter(s=>s.setType==='正式' || !s.setType).length;
/** 目標組數只給菜單上的動作；菜單外（歷史帶出或臨時加入）的動作不設目標，輸入區一直開著 */
const targetOf = it => it.plan ? (it.plan.sets || it.last.filter(s=>s.setType==='正式').length || 0) : 0;
const workDone = it => { const t = targetOf(it); return t>0 && workCount(it)>=t; };
/** 菜單備註「另加 N 組下降組」＝這個動作本來就排了 N 組下降組 */
const plannedDrops = it => { if (!isWeighty(it.type)) return 0; const m = /另加\s*(\d+)\s*組下降組/.exec(it.plan?.note || ''); return m ? +m[1] : 0; };
const dropCount = it => it.todaySets.filter(s=>s.setType==='下降組').length;
const skipKey = it => sessKey(view.day)+'|'+it.ex;
const dropsLeft = it => skips[skipKey(it)] ? 0 : Math.max(0, plannedDrops(it) - dropCount(it));
const isDone = it => workDone(it) && dropsLeft(it)===0;
/** 菜單上、還沒做完的動作（自動跳轉只跳到這些；菜單外的動作不會被自動打開） */
const isPending = it => targetOf(it)>0 && !isDone(it);
const dropRel = it => isWeighty(it.type) && (/下降/.test(planText(it.plan)) || it.last.some(s=>s.setType==='下降組') || it.todaySets.some(s=>s.setType==='下降組'));
function activeItem(){ return dayItems()[view.active]; }

/* ─────────── 輸入狀態與預填 ─────────── */
let form = null;
function nextSetNo(it, type){
  // 用最大編號 +1，刪掉中間一組也不會撞號（正式與下降組共用一條序號）
  const pool = it.todaySets.filter(s => type==='熱身' ? s.setType==='熱身' : s.setType!=='熱身');
  return pool.reduce((m,s) => Math.max(m, Number(s.setNo)||0), 0) + 1;
}
/** 預填：重量沿用今天上一組（沒有就用建議），次數／RIR 對照上次同一組；下降組約為上一組的 75% */
function prefill(it, setType){
  const t = it.type;
  if (isCardio(t) || t==='計時型'){
    const src = it.todaySets[it.todaySets.length-1] || it.last[0] || {};
    const f = {setType:'正式'};
    ['z2min','z2km','z2inc','sprSec','sprM','sprInc','jogSec','jogM','jogInc','rounds','timedSec'].forEach(k => f[k] = src[k]);
    if (t==='計時型'){
      const lastSame = it.last.filter(s=>s.setType!=='熱身')[it.todaySets.length];
      f.timedSec = (lastSame?.timedSec ?? f.timedSec ?? 30);
      if (it.suggestion?.timedSec && !it.todaySets.length) f.timedSec = it.suggestion.timedSec;
    }
    f.note = '';
    return f;
  }
  const idx = it.todaySets.filter(s => s.setType===setType).length;
  const pool = it.last.filter(s => s.setType===setType);
  const lastSame = pool[idx] || pool[pool.length-1];
  const todayPrev = it.todaySets[it.todaySets.length-1];
  const todayPrevWork = [...it.todaySets].reverse().find(s => s.setType==='正式');
  const sug = sugOf(it);
  let kg, reps, rir;
  if (setType==='正式'){
    if (todayPrevWork) kg = todayPrevWork.kg;
    else if (sug && sug.kg!==undefined && sug.kg!=='') kg = sug.kg;
    else kg = lastSame?.kg ?? '';
  } else {
    if (lastSame && lastSame.kg!==undefined && lastSame.kg!=='') kg = lastSame.kg;
    else if (todayPrev && Number(todayPrev.kg) > 0){ const st = plateStep(it); kg = Math.max(0, Math.round(todayPrev.kg*0.75/st)*st); }
    else kg = '';
  }
  reps = lastSame?.reps ?? todayPrev?.reps ?? 8;
  if (setType==='正式' && sug && lastSame && Number(kg)===Number(sug.kg)) reps = Math.max(1, Number(lastSame.reps) + (sug.repsDelta||0));
  rir = lastSame?.rir ?? (setType==='正式' ? 2 : 0);
  if (!lastSame && setType==='正式' && it.plan?.reps?.length){
    const r = it.plan.reps[idx] ?? it.plan.reps[it.plan.reps.length-1];
    const m = /\d+/.exec(r);
    if (m) reps = Number(m[0]); else if (r==='力竭') rir = 0;
  }
  if (setType==='下降組') rir = 0;
  return {setType, kg, reps, rir, note:''};
}
/** 下一組的預設輸入：正式組做完、菜單還有下降組沒做 → 直接切到下降組 */
function defaultForm(it){
  const st = (workDone(it) && dropsLeft(it)>0) ? '下降組' : '正式';
  return {...prefill(it, st), ex:it.ex, editId:null, more:false};
}
function ensureForm(it){ if (!form || form.ex!==it.ex) form = defaultForm(it); }
function readInputs(){
  if (!form) return;
  app.querySelectorAll('.ed input[id]').forEach(i => { if (i.id==='note') form.note = i.value; else form[i.id] = i.value; });
}
function updateCur(){
  const c = $('#curnow'), it = activeItem();
  if (c && it && form) c.textContent = setText({...form, _type:it.type});
}

/* ─────────── 訓練頁：整場一頁 ─────────── */
function renderDay(){
  stopHold();
  const d = dayData();
  if (!view.loaded && !loading[view.day]) loadDay(view.day);
  const items = d?.items || [];
  if (d && (view.active===undefined || view.active >= items.length)){
    // 先找菜單上還沒做完的；整天都沒有目標組數（例如第一次的 Cardio）才退回第一個
    let i = items.findIndex(isPending);
    if (i<0 && !items.some(x=>targetOf(x)>0)) i = items.findIndex(x=>!x.todaySets.length);
    view.active = items.length ? (i<0 ? -1 : i) : -1;
  }
  const it = activeItem(); if (it) ensureForm(it);
  const total = items.reduce((a,x)=>a+x.todaySets.length, 0);
  app.innerHTML = `
  <div class="top"><button class="iconbtn" id="back" aria-label="返回">${ICON.back}</button><h1>${esc(view.day)}</h1><span id="sync" class="sync hidden"></span>${total ? '<button class="endbtn" id="end">結束</button>' : ''}</div>
  <div id="list">${!d ? '<div class="exb skel"></div><div class="exb skel"></div><div class="exb skel"></div>'
    : (items.length ? items.map((x,i)=>exBlock(x,i)).join('') : '<p class="muted empty">這個訓練日還沒有動作，按下面加入。</p>')}</div>
  <button class="ghost" id="add">＋ 加入其他動作</button>
  ${restBarHTML()}`;
  renderSync(); tickRest(); bindRest();
  bindDay();
}

function exBlock(it, i){
  const t = it.type, n = workCount(it), target = targetOf(it), done = isDone(it);
  const badgeTxt = (workDone(it) && dropsLeft(it)>0) ? '降'+dropCount(it)+'/'+plannedDrops(it) : n + (target ? '/'+target : '');
  const badge = `<div class="badge ${done?'done':''}" ${badgeTxt.length>3?'style="font-size:11px"':''}>${done ? ICON.check : badgeTxt}</div>`;
  const plan = planText(it.plan);
  if (i !== view.active){
    const line = it.todaySets.length ? summary(it.todaySets, t)
      : (plan || (it.lastDate ? '上次 ' + summary(it.last, t) : '第一次做'));
    return `<section class="exb ${done?'isdone':''}" id="ex${i}"><button class="exh" data-open="${i}">${badge}
      <div class="body"><div class="name">${esc(it.ex)}</div><div class="line">${esc(line)}</div></div><span class="chev">${ICON.chev}</span></button></section>`;
  }
  const sug = sugOf(it);
  const metaLines = [
    plan ? esc(plan) : '',
    sug ? `<span class="sug">→ ${esc(sug.text)}</span>` : '',
    it.best ? `<span class="faint">最佳 e1RM ${fmt(it.best)}</span>` : '',
  ].filter(Boolean);

  // 組列表
  const lastW = it.last.filter(s=>s.setType==='正式'), lastD = it.last.filter(s=>s.setType==='下降組');
  let wi = 0, di = 0;
  const prevTxt = p => p ? esc(setText({...p, _type:t})) : '—';
  const rows = it.todaySets.map(s => {
    const drop = s.setType==='下降組';
    const prev = drop ? lastD[di++] : lastW[wi++];
    const no = drop ? '降' : '#'+wi;
    return `<div class="srow done ${drop?'drop':''} ${s.pending?'pend':''} ${form?.editId===s.setId?'editing':''} ${s.setId===justLogged?'pop':''}" data-edit="${esc(s.setId)}">
      <span class="no">${no}</span><span class="prev">${prevTxt(prev)}</span><span class="now">${esc(setText({...s,_type:t}))}</span>
      <span class="st">${s.pending ? '<i class="dot"></i>' : ICON.check}</span></div>`;
  });
  const showEd = !!form.editId || !done || form.more || !target;
  const remain = Math.max(0, target - n);
  const dLeft = dropsLeft(it);
  const formDrop = form.setType==='下降組';
  const curWork = showEd && !form.editId && !formDrop;
  for (let k=0; k<remain; k++){
    const cur = k===0 && curWork;
    rows.push(`<div class="srow plan ${cur?'cur':''}"><span class="no">#${n+k+1}</span><span class="prev">${prevTxt(lastW[n+k])}</span>
      <span class="now" ${cur?'id="curnow"':''}>${cur ? esc(setText({...form,_type:t})) : ''}</span><span class="st"></span></div>`);
  }
  // 菜單排好的下降組：還沒做的也先列出來
  for (let k=0; k<dLeft; k++){
    const cur = k===0 && showEd && !form.editId && formDrop;
    rows.push(`<div class="srow plan drop ${cur?'cur':''}"><span class="no">降</span><span class="prev">${prevTxt(lastD[di+k])}</span>
      <span class="now" ${cur?'id="curnow"':''}>${cur ? esc(setText({...form,_type:t})) : ''}</span><span class="st"></span></div>`);
  }
  if (showEd && !form.editId && ((formDrop && dLeft===0) || (curWork && remain===0))){
    const drop = form.setType==='下降組';
    rows.push(`<div class="srow plan cur ${drop?'drop':''}"><span class="no">${drop?'降':'#'+(n+1)}</span>
      <span class="prev">${prevTxt(drop ? lastD[di] : lastW[n])}</span><span class="now" id="curnow">${esc(setText({...form,_type:t}))}</span><span class="st"></span></div>`);
  }
  const hasRows = rows.length > 0;
  const nextIdx = nextOpenIdx(i);
  const tail = showEd ? editorHTML(it, n) : `
    <div class="after">
      <div class="${isWeighty(t)?'row2':''}"><button class="ghost" id="more">＋ 再一組</button>${isWeighty(t)?'<button class="ghost" id="dropbtn">＋ 下降組</button>':''}</div>
      <button class="big" id="nextEx">${nextIdx>=0 ? '下一個動作' : '完成訓練'}</button>
    </div>`;
  return `<section class="exb active ${done?'isdone':''}" id="ex${i}">
    <div class="exh">${badge}<div class="body"><div class="name">${esc(it.ex)}</div></div></div>
    ${metaLines.length ? `<div class="meta">${metaLines.join('<br>')}</div>` : ''}
    ${hasRows ? `<div class="srow shead"><span>組</span><span>上次${it.lastDate?' '+shortDate(it.lastDate):''}</span><span>今天</span><span></span></div>${rows.join('')}` : ''}
    ${tail}
  </section>`;
}

function editorHTML(it, n){
  const t = it.type, f = form, editing = !!f.editId;
  let inputs = '';
  const stepper = (id, label, mode) => `<div class="stp"><div class="lab">${label}</div><div class="ctl">
      <button data-step="${id}" data-dir="-1" aria-label="減少">−</button>
      <input id="${id}" inputmode="${mode}" value="${fmt(f[id])}">
      <button data-step="${id}" data-dir="1" aria-label="增加">＋</button></div></div>`;
  if (isWeighty(t)){
    const kgLabel = t==='自重型' ? '額外負重 kg' : (isDB(it.ex) ? '重量 kg（單邊）' : '重量 kg');
    inputs = `
      <div class="edhead"><span class="small muted">${editing ? '組類型' : '這一組'}</span>
        <div class="mseg" id="stype">${['正式','下降組'].map(x=>`<button data-v="${x}" class="${f.setType===x?'on':''}">${x}</button>`).join('')}</div></div>
      <div class="steppers">${stepper('kg', kgLabel, 'decimal')}${stepper('reps', '次數', 'numeric')}</div>
      <div class="lab rirlab">RIR　<span class="faint">還能再做幾下・0＝力竭</span></div>
      <div class="seg" id="rir">${[0,1,2,3,4,5].map(x=>`<button data-v="${x}" class="${String(f.rir)===String(x)?'on':''}">${x}</button>`).join('')}</div>`;
  } else if (t==='計時型'){
    inputs = `<div class="steppers" style="grid-template-columns:1fr">${stepper('timedSec', '秒數', 'numeric')}</div>`;
  } else if (t==='有氧-HIIT'){
    const c = (id,l) => `<div><div class="lab">${l}</div><input id="${id}" inputmode="decimal" value="${fmt(f[id])}"></div>`;
    inputs = `<div class="cgrid">${c('sprSec','快跑 秒')}${c('sprM','快跑 公尺')}${c('sprInc','快跑 坡度%')}${c('jogSec','慢跑 秒')}${c('jogM','慢跑 公尺')}${c('jogInc','慢跑 坡度%')}${c('rounds','回合數')}</div>`;
  } else {
    const c = (id,l) => `<div><div class="lab">${l}</div><input id="${id}" inputmode="decimal" value="${fmt(f[id])}"></div>`;
    inputs = `<div class="cgrid">${c('z2min','時間（分）')}${c('z2km','距離 km')}${c('z2inc','坡度 %')}</div>`;
  }
  const label = editing ? '更新這一組' : isCardio(t) ? '記錄' : t==='計時型' ? `完成第 ${n+1} 組`
    : f.setType==='下降組' ? (dropsLeft(it)>0 ? `完成下降組 ${dropCount(it)+1}/${plannedDrops(it)}` : '完成下降組') : `完成第 ${n+1} 組`;
  const skipBtn = !editing && f.setType==='下降組' && dropsLeft(it)>0 && workDone(it);
  const noteOpen = !!f.note || f.noteOpen;
  return `<div class="ed">
    ${editing ? '<div class="editbar"><span>修改這一組</span><button id="cancelEdit">取消</button></div>' : ''}
    ${inputs}
    <button class="notebtn ${noteOpen?'hidden':''}" id="notebtn">＋ 備註</button>
    <input id="note" class="textin ${noteOpen?'':'hidden'}" value="${esc(f.note||'')}" placeholder="備註（選填）">
    <button class="big" id="log">${label}</button>
    ${editing ? '<button class="ghost danger" id="del">刪除這一組</button>'
      : skipBtn ? '<button class="ghost" id="skipDrops">略過下降組 ›</button>'
      : (form.more || (isDone(it) && form.setType==='下降組')) ? `<button class="ghost" id="nextEx">完成這個動作 ›</button>` : ''}
  </div>`;
}

function nextOpenIdx(from){
  const items = dayItems();
  for (let j=from+1; j<items.length; j++) if (isPending(items[j])) return j;
  for (let j=0; j<from; j++) if (isPending(items[j])) return j;
  return -1;
}
function scrollToActive(){
  requestAnimationFrame(() => { const el = $('#ex'+view.active); if (el) el.scrollIntoView({behavior:'smooth', block:'start'}); });
}
function activate(i){ form = null; view.active = i; renderDay(); scrollToActive(); }
function advance(){
  const j = nextOpenIdx(view.active);
  if (j < 0){ form = null; view.active = -1; renderDay(); openFinish(); return; }
  activate(j);
}

/* 長按步進器會連續加減 */
function stepField(k, dir){
  const it = activeItem(); if (!it) return;
  let v = parseFloat(form[k]); if (isNaN(v)) v = 0;
  if (k==='kg'){
    v += dir * kgStep();
  } else v += dir * (k==='timedSec' ? 5 : 1);
  form[k] = Math.max(0, Math.round(v*100)/100);
  const inp = $('#'+k); if (inp) inp.value = fmt(form[k]);
  updateCur();
}
/* 長按：全域只有一組計時器。手指放開（在任何地方）、按鈕被重繪掉、切到背景、
   或連續超過約 6 秒，都會停下來，不會再失控 */
let holdT1 = null, holdT2 = null, holdBtn = null;
function stopHold(){ clearTimeout(holdT1); clearInterval(holdT2); holdT1 = holdT2 = null; holdBtn = null; }
['pointerup','pointercancel','touchend','touchcancel','mouseup','blur'].forEach(ev => window.addEventListener(ev, stopHold, true));
document.addEventListener('visibilitychange', stopHold);
function bindStepper(b){
  const k = b.dataset.step, dir = +b.dataset.dir;
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); stopHold(); readInputs(); stepField(k, dir);
    holdBtn = b; let n = 0;
    holdT1 = setTimeout(() => {
      holdT2 = setInterval(() => {
        if (holdBtn !== b || !b.isConnected || ++n > 55) return stopHold();
        stepField(k, dir);
      }, 110);
    }, 450);
  });
  b.addEventListener('pointerleave', stopHold);
  b.addEventListener('contextmenu', e => e.preventDefault());
}

function bindDay(){
  $('#back').onclick = goHome;
  app.querySelectorAll('[data-open]').forEach(b => b.onclick = () => activate(+b.dataset.open));
  $('#add').onclick = () => pickExercise(ex => {
    const d = dayData() || (cache[view.day] = {today:todayStr(), items:[]});
    let i = d.items.findIndex(x=>x.ex===ex.name);
    if (i<0){ d.items.push({ex:ex.name, type:ex.type, plan:null, last:[], prev2:[], todaySets:[], lastDate:null, suggestion:null}); i=d.items.length-1; LS.set('cache', cache); }
    activate(i);
  });
  $('#end') && ($('#end').onclick = openFinish);
  const it = activeItem(); if (!it) return;

  app.querySelectorAll('[data-edit]').forEach(r => r.onclick = () => {
    const s = it.todaySets.find(x=>x.setId===r.dataset.edit); if (!s) return;
    form = {...s, ex:it.ex, editId:s.setId, note:s.note||'', more:false}; renderDay();
    requestAnimationFrame(() => { const e = $('#ex'+view.active+' .ed'); if (e) e.scrollIntoView({behavior:'smooth', block:'center'}); });
  });
  app.querySelectorAll('[data-step]').forEach(bindStepper);
  app.querySelectorAll('.ed input[id]').forEach(i => i.addEventListener('input', () => { readInputs(); updateCur(); }));
  $('#stype') && $('#stype').querySelectorAll('button').forEach(b => b.onclick = () => {
    readInputs(); const v = b.dataset.v;
    if (form.editId){ form.setType = v; if (v==='下降組') form.rir = 0; renderDay(); return; }
    const keep = form.note;
    if (v==='下降組') stopRest();
    form = {...prefill(it, v), ex:it.ex, editId:null, note:keep, more: (v==='下降組' && dropsLeft(it)===0) || isDone(it)}; renderDay();
  });
  $('#rir') && $('#rir').querySelectorAll('button').forEach(b => b.onclick = () => {
    readInputs();
    form.rir = (String(form.rir)===b.dataset.v && form.setType!=='正式') ? '' : +b.dataset.v;
    $('#rir').querySelectorAll('button').forEach(x=>x.classList.toggle('on', String(form.rir)===x.dataset.v));
    updateCur();
  });
  $('#notebtn') && ($('#notebtn').onclick = () => { form.noteOpen = true; $('#notebtn').classList.add('hidden'); const n=$('#note'); n.classList.remove('hidden'); n.focus(); });
  $('#log') && ($('#log').onclick = () => { unlockAudio(); readInputs(); submit(it); });
  $('#cancelEdit') && ($('#cancelEdit').onclick = () => { form = defaultForm(it); renderDay(); });
  $('#del') && ($('#del').onclick = () => { undoSet(it, form.editId); form = defaultForm(it); renderDay(); });
  $('#skipDrops') && ($('#skipDrops').onclick = () => {
    for (const k of Object.keys(skips)) if (!k.startsWith(todayStr())) delete skips[k];
    skips[skipKey(it)] = true; LS.set('skipDrops', skips);
    form = null; advance();
  });
  $('#more') && ($('#more').onclick = () => { form = {...prefill(it,'正式'), ex:it.ex, editId:null, more:true}; renderDay(); });
  $('#dropbtn') && ($('#dropbtn').onclick = () => { stopRest(); form = {...prefill(it,'下降組'), ex:it.ex, editId:null, more:true}; renderDay(); });
  $('#nextEx') && ($('#nextEx').onclick = advance);
}

function pickExercise(cb){
  const list = meta?.exercises || [];
  const inDay = new Set(dayItems().map(x=>x.ex));
  const sh = sheet(`<div class="sheethead"><b>選擇動作</b><button class="iconbtn" data-close aria-label="關閉">${ICON.x}</button></div>
    <button class="ghost" id="newEx" style="margin:4px 0 8px">＋ 新增動作</button>
    ${list.length > 8 ? '<input id="q" class="textin" style="width:100%;margin:6px 0 4px" placeholder="搜尋動作">' : ''}
    <div class="list">${list.map((e,i)=>`<button data-k="${i}" class="${inDay.has(e.name)?'in':''}"><span>${esc(e.name)}</span><span class="small faint">${inDay.has(e.name)?'已在清單':esc(e.type)}</span></button>`).join('') || '<p class="muted">沒有動作清單，請先連線一次。</p>'}</div>`);
  const q = $('#q', sh);
  if (q) q.oninput = () => { const s = q.value.trim().toLowerCase(); sh.querySelectorAll('[data-k]').forEach(b => b.classList.toggle('hidden', !!s && !list[+b.dataset.k].name.toLowerCase().includes(s))); };
  sh.querySelectorAll('[data-k]').forEach(b => b.onclick = () => { sh.remove(); cb(list[+b.dataset.k]); });
  $('#newEx', sh).onclick = () => { const q0 = q ? q.value.trim() : ''; sh.remove(); openNewExercise(q0, cb); };
}

/** 新增動作：寫進試算表「動作清單」，並直接加到今天的訓練 */
function openNewExercise(name0, cb){
  const muscles = meta?.muscles?.length ? meta.muscles : MUSCLES;
  const opt = (sel, ph) => `<option value="">${ph}</option>` + muscles.map(m=>`<option ${m===sel?'selected':''}>${esc(m)}</option>`).join('');
  let type = '重量型';
  const sh = sheet(`
    <div class="sheethead"><b>新增動作</b><button class="iconbtn" data-close aria-label="關閉">${ICON.x}</button></div>
    <div class="label">動作名稱</div>
    <input id="nxName" class="textin" style="width:100%" value="${esc(name0)}" placeholder="例如 Seated Dip Machine" autocomplete="off">
    <p class="small faint" style="margin:6px 2px 0">換了器材請建成新動作（不同器材的重量不能互比）。</p>
    <div class="label">動作類型</div>
    <div class="seg wrap" id="nxType">${EX_TYPES.map(x=>`<button data-v="${esc(x)}" class="${x===type?'on':''}">${esc(x.replace('有氧-','有氧 '))}</button>`).join('')}</div>
    <div id="nxMus">
      <div class="label">主要肌群</div>
      <select id="nxP" class="sel">${opt('', '請選擇')}</select>
      <div class="label">協同肌群（選填，各算 0.5 組）</div>
      <div class="syn">${[1,2,3].map(i=>`<select id="nxS${i}" class="sel">${opt('', '協同肌群 '+i)}</select>`).join('')}</div>
    </div>
    <button class="big" id="nxSave">建立並加入</button>`);
  const nameIn = $('#nxName', sh);
  sh.querySelectorAll('#nxType button').forEach(b => b.onclick = () => {
    type = b.dataset.v;
    sh.querySelectorAll('#nxType button').forEach(x=>x.classList.toggle('on', x===b));
    $('#nxMus', sh).classList.toggle('hidden', isCardio(type));
  });
  $('#nxSave', sh).onclick = () => {
    const name = nameIn.value.trim().replace(/\s+/g, ' ');
    if (!name){ toast('請輸入動作名稱'); return; }
    const list = meta?.exercises || [];
    const dup = list.find(e => e.name.toLowerCase() === name.toLowerCase());
    if (dup){ toast('已經有「'+dup.name+'」，直接加入'); sh.remove(); cb(dup); return; }
    if (list.length >= 50){ toast('動作清單已滿 50 個'); return; }
    const primary = isCardio(type) ? '' : $('#nxP', sh).value;
    if (!isCardio(type) && !primary){ toast('請選主要肌群'); return; }
    const synergists = isCardio(type) ? [] : [1,2,3].map(i=>$('#nxS'+i, sh).value).filter((m,i,a)=>m && m!==primary && a.indexOf(m)===i);
    // 先排進佇列：佇列依序送出，這個動作一定比它的第一組先寫進試算表
    enqueue({action:'addExercise', name, type, primary, synergists});
    const ex = {name, type};
    meta = {...(meta||{}), exercises:[...list, ex]}; LS.set('meta', meta);
    haptic(); toast('已新增 '+name); sh.remove(); cb(ex);
  };
  setTimeout(()=>nameIn.focus(), 300);
}

/* ─────────── 記錄 ─────────── */
let justLogged = null;
function buildPayload(it, f){
  const t = it.type, num = v => (v===''||v===undefined||v===null||isNaN(parseFloat(v))) ? '' : parseFloat(v);
  const p = {date: todayStr(), day: view.day, ex: it.ex, setType: f.setType || '正式', note: f.note || ''};
  if (isWeighty(t)){
    p.kg = num(f.kg); p.reps = num(f.reps); p.rir = num(f.rir);
    if (t==='自重型' && p.kg===0) p.kg='';
  } else if (t==='計時型') p.timedSec = num(f.timedSec);
  else if (t==='有氧-HIIT') ['sprSec','sprM','sprInc','jogSec','jogM','jogInc','rounds'].forEach(k=>p[k]=num(f[k]));
  else ['z2min','z2km','z2inc'].forEach(k=>p[k]=num(f[k]));
  return p;
}
function validate(it, p){
  const t = it.type;
  if (t==='重量型' && (p.kg==='' || !(p.reps>0))) return '請填重量和次數';
  if (t==='自重型' && !(p.reps>0)) return '請填次數';
  if (isWeighty(t) && p.setType==='正式' && p.rir==='') return '正式組請選 RIR';
  if (t==='計時型' && !(p.timedSec>0)) return '請填秒數';
  if (t==='有氧-HIIT' && !(p.sprSec>0 || p.jogSec>0)) return '請填快跑或慢跑秒數';
  if (isCardio(t) && t!=='有氧-HIIT' && !(p.z2min>0)) return '請填時間';
  return '';
}
function submit(it){
  const p = buildPayload(it, form);
  const err = validate(it, p); if (err){ toast(err); return; }
  if (form.editId){
    const s = it.todaySets.find(x=>x.setId===form.editId);
    p.setNo = s.setNo; p.set_id = s.setId;
    Object.assign(s, stripEmpty(p));
    if (it.type==='重量型' && p.kg>0 && p.reps>0) s.e1rm = e1rmOf(p.kg, p.reps, p.rir);
    const queued = queue.find(q => q.action==='set' && q.set_id===s.setId);
    if (queued){ Object.assign(queued, p); LS.set('queue', queue); flush(); }
    else enqueue({action:'update', ...p});
    LS.set('cache', cache); haptic(); toast('已更新');
    form = defaultForm(it); renderDay(); return;
  }
  const wasDone = isDone(it);
  p.setNo = nextSetNo(it, p.setType); p.set_id = uuid(); p.source = 'pwa';
  const local = {...stripEmpty(p), setId:p.set_id, pending:true};
  let pr = false;
  if (it.type==='重量型' && p.kg>0 && p.reps>0){
    local.e1rm = e1rmOf(p.kg, p.reps, p.rir);
    const todayBest = Math.max(0, ...it.todaySets.map(s => Number(s.e1rm)||0));
    pr = it.best > 0 && local.e1rm > it.best && local.e1rm > todayBest;
  }
  it.todaySets.push(local); LS.set('cache', cache);
  enqueue({action:'set', ...p});

  // 訓練時間：第一組到最後一組
  const key = sessKey(view.day), now = Date.now();
  sessions[key] = sessions[key] ? {...sessions[key], last:now} : {start:now, last:now};
  for (const k of Object.keys(sessions)) if (!k.startsWith(todayStr())) delete sessions[k];
  LS.set('sessions', sessions);
  if (finished[key]){ delete finished[key]; LS.set('finished', finished); }

  haptic(); justLogged = local.setId;
  if (pr) toast('🏆 新紀錄　e1RM ' + fmt(local.e1rm) + ' kg');

  // 下一組的預填
  const planned = plannedDrops(it) > 0;
  const dropsNext = workDone(it) && dropsLeft(it) > 0;   // 菜單排的下降組還沒做完：接著做、不休息
  if (dropsNext) form = {...prefill(it,'下降組'), ex:it.ex, editId:null, more:false};
  else if (p.setType==='下降組' && !planned) form = {...prefill(it,'下降組'), ex:it.ex, editId:null, more:true};
  else form = {...prefill(it,'正式'), ex:it.ex, editId:null, more: wasDone};
  renderDay(); justLogged = null;
  if (dropsNext) stopRest();
  else if (!isCardio(it.type) && p.setType!=='下降組') startRest();

  // 剛好做完這個動作：沒有下降組習慣、或菜單排的下降組也做完了，就自動跳到下一個
  const autoNext = (p.setType==='正式' && !dropRel(it)) || planned;
  if (!wasDone && isDone(it) && autoNext && nextOpenIdx(view.active) >= 0){
    const here = view.active;
    setTimeout(() => { if (view.name==='day' && view.active===here && !form?.editId) advance(); }, 650);
  }
}
function stripEmpty(p){ const o={}; for (const [k,v] of Object.entries(p)) if (v!=='' && v!==undefined) o[k]=v; return o; }
function undoSet(it, setId){
  it.todaySets = it.todaySets.filter(s=>s.setId!==setId);
  const i = queue.findIndex(q => q.action==='set' && q.set_id===setId);
  if (i>=0 && !(flushing && i===0)){ queue.splice(i,1); queue = queue.filter(q=>q.set_id!==setId); LS.set('queue', queue); }
  else enqueue({action:'undo', set_id:setId});
  LS.set('cache', cache); renderSync(); toast('已刪除');
}

/* ─────────── 完成訓練：總結 ─────────── */
function openFinish(){
  const items = dayItems().filter(it => it.todaySets.length);
  const key = sessKey(view.day);
  const sets = items.reduce((a,it)=>a+it.todaySets.length, 0);
  const vol = sets => sets.filter(s=>s.setType!=='熱身').reduce((a,s)=>a+(Number(s.kg)||0)*(Number(s.reps)||0), 0);
  const wItems = items.filter(it => it.type==='重量型');
  const v = wItems.reduce((a,it)=>a+vol(it.todaySets), 0);
  const lv = wItems.filter(it=>it.last.length).reduce((a,it)=>a+vol(it.last), 0);
  const diff = lv ? Math.round((v-lv)/lv*100) : null;
  const s = sessions[key];
  const mins = s ? Math.max(1, Math.round((s.last - s.start)/60000)) : null;
  const prs = wItems.filter(it => it.best > 0 && Math.max(...it.todaySets.map(x => Number(x.e1rm) || e1rmOf(x.kg, x.reps, x.rir))) > it.best);
  // 提早結束：列出菜單上還沒做完的動作
  const notDone = dayItems().filter(it => targetOf(it) > 0 && !isDone(it));
  const ndTxt = notDone.map(it => {
    const n = workCount(it), t = targetOf(it);
    if (n >= t) return it.ex + '（下降組 ' + dropCount(it) + '/' + plannedDrops(it) + '）';
    return it.ex + (n ? '（' + n + '/' + t + '）' : '');
  }).join('、');
  const sh = sheet(`
    <div class="sheethead"><b>${esc(view.day)}・${shortDate(todayStr())}</b><button class="iconbtn" data-close aria-label="關閉">${ICON.x}</button></div>
    <div class="stats">
      <div class="stat"><b>${mins ?? '—'}</b><span class="small">分鐘</span></div>
      <div class="stat"><b>${sets}</b><span class="small">組</span></div>
      <div class="stat"><b>${v ? Math.round(v).toLocaleString() : '—'}</b><span class="small">總量 kg${diff!==null ? ` <span class="${diff>=0?'up':'down'}">${diff>=0?'+':''}${diff}%</span>`:''}</span></div>
    </div>
    ${prs.map(it => `<div class="pr">🏆 ${esc(it.ex)} 破 e1RM 紀錄</div>`).join('')}
    ${notDone.length ? `<div class="skipped"><b>還有 ${notDone.length} 個動作沒做完</b>${esc(ndTxt)}<br><span class="faint">按「結束訓練」就提早結束；沒做的動作不會寫入試算表。</span></div>` : ''}
    <div class="sumlist">${items.map(it => `<div><span>${esc(it.ex)}</span><span>${esc(summary(it.todaySets, it.type))}</span></div>`).join('') || '<p class="muted">今天還沒有記錄。</p>'}</div>
    <p class="small faint">時間＝第一組到最後一組；總量只算重量型動作${diff!==null?'，和上次同一天的菜單比較':''}。</p>
    <button class="big" id="done">${notDone.length ? '結束訓練' : '完成'}</button>
    <button class="ghost" data-close>繼續練</button>`);
  haptic();
  $('#done', sh).onclick = () => {
    finished[key] = true; LS.set('finished', finished);
    stopRest(); sh.remove(); goHome();
  };
}

/* ─────────── 啟動 ─────────── */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
history.replaceState(view, '');
render(); flush();
</script>
</body>
